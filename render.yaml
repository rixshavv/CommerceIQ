services:
  - type: web
    name: ecommerce-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-intelligence-db
          property: connectionString

databases:
  - name: ecommerce-intelligence-db
    plan: free
